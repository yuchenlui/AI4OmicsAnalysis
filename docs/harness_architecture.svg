<text x="40" y="774" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">运行：python run.py ｜ --status 查看状态 ｜ --from integrate 续跑 ｜ --only novelty,negctrl ｜ --force 忽略哈希</text>
<text x="40" y="800" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">LLM 可选：设 LLM_BASE_URL / LLM_API_KEY 启用语义判读；未配置则全程规则模式，结果可复现。</text>
