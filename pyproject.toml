[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4omics"
version = "0.1.0"
description = "Deterministic omics screening harness: staged pipeline, gated QC, negative controls, optional LLM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "pandas>=2", "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["ai4omics*"]

[project.scripts]
ai4omics = "ai4omics.cli:main"
